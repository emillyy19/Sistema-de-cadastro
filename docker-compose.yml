version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gov-it-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./governanca.db
    volumes:
      # Volume persistente para salvar o arquivo governanca.db e os logs de auditoria
      - backend_data:/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gov-it-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
    driver: local
